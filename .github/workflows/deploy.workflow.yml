name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: HandcrankEngine/install-sdl-packages@28e412ca7918a0341f2846f5181a097dfc2059be # v0.5.0
        with:
          BUILD_SDL_FOR_EMSCRIPTEN: true
          SDL_VERSION: 3.4.14
          SDL_IMAGE_VERSION: 3.4.4
          SDL_TTF_VERSION: 3.2.2
          SDL_MIXER_VERSION: 3.2.4

      - name: Build WebGL
        run: |
          mkdir -p build/web
          em++ -std=c++17 -Os -o build/web/index.html src/*.cpp -Ifonts -Iimages -Iinclude -Isrc \
            -I"${SDL_PATH}/include" -L"${SDL_PATH}/lib" \
            -I"${SDL_IMAGE_PATH}/include" -L"${SDL_IMAGE_PATH}/lib" \
            -I"${SDL_TTF_PATH}/include" -L"${SDL_TTF_PATH}/lib" \
            -I"${SDL_MIXER_PATH}/include" -L"${SDL_MIXER_PATH}/lib" \
            -lSDL3 -lSDL3_image -lSDL3_ttf -lSDL3_mixer \
            -s USE_FREETYPE=1 -s USE_HARFBUZZ=1 \
            -s MAX_WEBGL_VERSION=2 \
            --shell-file templates/web-minimal.html
          gzip -k build/web/index.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./build
          overwrite: true
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build/

      - name: Download Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push ./build/web scottdoxey/pong-demo:html5
